<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modular To-Do List</title>
    <link rel="stylesheet" href="prob3.css">
</head>
<body>
    <div class="container">
        <h1>To-Do List</h1>

        </div>
        <ul id="task-list"></ul>
    </div>
    <script src="prob3.js"></script>
</body>
</html>
