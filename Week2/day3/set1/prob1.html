<script>
  const reportObj = document.getElementById("report");
  // FIX: Added valid API parameters (latitude, longitude, current_weather)
  const url = "https://api.open-meteo.com/v1/forecast?latitude=13.90&longitude=79.29&current_weather=true";

  const fn_getWeather = async () => {
    try {
      reportObj.innerHTML = "Loading...";
      let response = await fetch(url);
      if (!response.ok) {
        throw new Error(`HTTP Error ${response.status}`);
      }
      let data = await response.json();
      displayWeather(data.current_weather);
    } catch (error) {
      reportObj.innerHTML = `<b style="color:red;">Error: ${error.message}</b>`;
    }
  };

  const displayWeather = (weather) => {
    reportObj.innerHTML = `
      <p><b>Temperature:</b> ${weather.temperature}°C</p>
      <p><b>Wind Speed:</b> ${weather.windspeed} km/h</p>
      <p><b>Report Time:</b> <span style="color:blue;">${weather.time}</span></p>
    `;
  };
</script>

</body>
