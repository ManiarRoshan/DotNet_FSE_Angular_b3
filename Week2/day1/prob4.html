<!DOCTYPE html>
<html>

<head>
    <title>IndexedDB Expense Tracker</title>
    <style>
        body {
            font-family: sans-serif;
            max-width: 600px;
            margin: 20px auto;
            line-height: 1.6;
        }

        .form-group {
            margin-bottom: 10px;
        }

        input {
            padding: 8px;
            margin-right: 5px;
        }

        button {
            padding: 8px 12px;
            cursor: pointer;
            background: #007bff;
            color: white;
            border: none;
            border-radius: 4px;
        }

        button.delete {
            background: #dc3545;
            font-size: 0.8em;
            margin-left: 10px;
        }

        ul {
            list-style: none;
            padding: 0;
        }

        li {
            background: #f4f4f4;
            margin: 5px 0;
            padding: 10px;
            border-radius: 4px;
            display: flex;
            justify-content: space-between;
        }
    </style>
</head>

<body>

    <h2>💰 Mini Expense Tracker</h2>

    <div class="form-group">
        <input type="text" id="title" placeholder="Expense Title">
        <input type="number" id="amount" placeholder="Amount">
        <input type="date" id="date">
    </div>

    <button onclick="addExpense()">Add Expense</button>
    <button onclick="viewExpenses()" style="background:#28a745">Refresh List</button>

    <h3>Expense History</h3>
    <ul id="output"></ul>

    <script>
        let db;

        // 1. OPEN DATABASE & SETUP
        (function initDB() {
            let request = indexedDB.open("ExpenseTrackerDB", 1);

            request.onupgradeneeded = function (e) {
                db = e.target.result;
                // CREATE TABLE (Object Store)
                let store = db.createObjectStore("expenses", { keyPath: "id", autoIncrement: true });
                console.log("Database Setup Complete");
            };

            request.onsuccess = function (e) {
                db = e.target.result;
                viewExpenses(); // Show data immediately
            };

            request.onerror = () => console.log("Database failed to open");
        })();

        // 2. CREATE (INSERT)
        function addExpense() {
            let title = document.getElementById("title").value;
            let amount = document.getElementById("amount").value;
            let date = document.getElementById("date").value;

            if (!title || !amount || !date) return alert("Please fill all fields");

            let tx = db.transaction("expenses", "readwrite");
            let store = tx.objectStore("expenses");

            // INSERT operation
            store.add({ title, amount: Number(amount), date });

            tx.oncomplete = function () {
                alert("Expense Saved!");
                clearInputs();
                viewExpenses();
            };
        }

        // 3. READ (SELECT)
        function viewExpenses() {
            let list = document.getElementById("output");
            list.innerHTML = "";

            let tx = db.transaction("expenses", "readonly");
            let store = tx.objectStore("expenses");
            let request = store.openCursor();

            request.onsuccess = function (e) {
                let cursor = e.target.result;
                if (cursor) {
                    let li = document.createElement("li");
                    li.innerHTML = `
                <span>
                    <strong>${cursor.value.title}</strong>: $${cursor.value.amount} 
                    <small>(${cursor.value.date})</small>
                </span>
                <button class="delete" onclick="deleteExpense(${cursor.value.id})">Delete</button>
            `;
                    list.appendChild(li);
                    cursor.continue(); // Move to next record
                }
            };
        }

        // 4. DELETE
        function deleteExpense(id) {
            let tx = db.transaction("expenses", "readwrite");
            let store = tx.objectStore("expenses");

            store.delete(id);

            tx.oncomplete = function () {
                viewExpenses();
            };
        }

        function clearInputs() {
            document.getElementById("title").value = "";
            document.getElementById("amount").value = "";
            document.getElementById("date").value = "";
        }
    </script>

</body>

</html>
