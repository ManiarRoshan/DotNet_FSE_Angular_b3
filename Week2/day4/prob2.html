<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Electronics Store</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" />
</head>
<body class="bg-light">

  <div class="container py-5">
    <h2 class="text-center mb-4">Latest Gadgets</h2>

    <div class="row row-cols-1 row-cols-md-2 row-cols-lg-4 g-4">
      

      <div class="col">
        <div class="card h-100 shadow-sm">
          <img src="Lap.png" class="card-img-top" alt="Laptop">
          <div class="card-body">
            <h5 class="card-title">Pro Laptop 15"</h5>
            <p class="card-text text-muted small">High-performance laptop for professionals and gamers.</p>
            <h6 class="text-primary">$1,200</h6>
          </div>
          <div class="card-footer bg-transparent border-0 d-flex justify-content-between pb-3">
            <button class="btn btn-outline-primary btn-sm">View Details</button>
            <button class="btn btn-success btn-sm">Add to Cart</button>
          </div>
        </div>
      </div>

      <div class="col">
        <div class="card h-100 shadow-sm">
          <img src="mob.png" class="card-img-top" alt="Smartphone">
          <div class="card-body">
            <h5 class="card-title">Smart Phone Z</h5>
            <p class="card-text text-muted small">Experience the future with our latest OLED display phone.</p>
            <h6 class="text-primary">$899</h6>
          </div>
          <div class="card-footer bg-transparent border-0 d-flex justify-content-between pb-3">
            <button class="btn btn-outline-primary btn-sm">View Details</button>
            <button class="btn btn-success btn-sm">Add to Cart</button>
          </div>
        </div>
      </div>
      
    </div>
  </div>

</body>
</html>
