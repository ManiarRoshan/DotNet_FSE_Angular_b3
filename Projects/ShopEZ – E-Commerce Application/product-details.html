
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ShopEZ – Product Details</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>

  <!-- ===== NAVBAR ===== -->
  <nav class="navbar navbar-expand-lg shopez-navbar">
    <div class="container">
      <a class="navbar-brand" href="index.html">Shop<span>EZ</span></a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navMenu">
        <ul class="navbar-nav ms-auto align-items-center gap-1">
          <li class="nav-item"><a class="nav-link" href="index.html"><i class="fa fa-house me-1"></i>Home</a></li>
          <li class="nav-item"><a class="nav-link active" href="products.html"><i class="fa fa-shop me-1"></i>Products</a></li>
          <li class="nav-item">
            <a class="nav-link cart-icon-btn" href="cart.html">
              <i class="fa fa-cart-shopping me-1"></i>Cart
              <span class="cart-badge" id="cartCount">0</span>
            </a>
          </li>
        </ul>
      </div>
    </div>
  </nav>

  <!-- ===== PAGE HEADER ===== -->
  <div class="page-header">
    <div class="container">
      <h2><i class="fa fa-circle-info me-2"></i>Product Details</h2>
      <p><a href="products.html" style="color:var(--primary); text-decoration:none;"><i class="fa fa-arrow-left me-1"></i>Back to Products</a></p>
    </div>
  </div>

  <!-- ===== PRODUCT DETAILS ===== -->
  <div class="container pb-5">
    <!-- Loading state -->
    <div id="loadingState" class="text-center py-5">
      <i class="fa fa-spinner fa-spin fa-2x" style="color:var(--primary)"></i>
      <p class="text-muted mt-2">Loading product...</p>
    </div>

    <!-- Product not found -->
    <div id="notFound" style="display:none;">
      <div class="empty-state">
        <i class="fa fa-circle-xmark"></i>
        <p>Product not found.</p>
        <a href="products.html" class="btn-primary-shopez">Back to Products</a>
      </div>
    </div>

    <!-- Product details content -->
    <div id="productDetails" style="display:none;">
      <div class="row g-4">
        <div class="col-md-5">
          <img id="detailImg" src="" alt="" class="details-img" />
        </div>
        <div class="col-md-7">
          <div class="details-box">
            <span class="category-badge" id="detailCategory"></span>
            <h2 id="detailName" style="font-weight:700; color:var(--navy); margin-bottom:10px;"></h2>
            <p id="detailDescription" style="color:#555; font-size:0.95rem; line-height:1.7; margin-bottom:18px;"></p>
            <div class="details-price mb-4" id="detailPrice"></div>

            <!-- Info rows -->
            <div class="mb-3" style="font-size:0.9rem; color:#666;">
              <i class="fa fa-truck-fast me-2" style="color:var(--primary)"></i>Free delivery on orders above ₹999<br>
              <i class="fa fa-rotate-left me-2 mt-2" style="color:var(--primary)"></i>7-day easy return policy<br>
              <i class="fa fa-shield-halved me-2 mt-2" style="color:var(--primary)"></i>1 Year manufacturer warranty
            </div>

            <button class="btn-cart" id="addToCartBtn" style="font-size:1rem; padding:12px;">
              <i class="fa fa-cart-plus me-2"></i>Add to Cart
            </button>
            <a href="cart.html" class="btn-view d-inline-block mt-2 ms-2" style="padding:10px 18px;">
              <i class="fa fa-cart-shopping me-1"></i>View Cart
            </a>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- ===== FOOTER ===== -->
  <footer class="shopez-footer">
    <div class="container">
      <hr>
      <p class="text-center mb-0" style="font-size:0.82rem;">© 2025 ShopEZ. All rights reserved.</p>
    </div>
  </footer>

  <!-- Toast Notification -->
  <div class="shopez-toast" id="shopezToast"></div>

  <!-- Scripts -->
  <script src="https://code.jquery.com/jquery-3.7.0.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/common.js"></script>
  <script src="js/cart.js"></script>
  <script src="js/products.js"></script>
  <script src="js/product-details.js"></script>
</body>
</html>
