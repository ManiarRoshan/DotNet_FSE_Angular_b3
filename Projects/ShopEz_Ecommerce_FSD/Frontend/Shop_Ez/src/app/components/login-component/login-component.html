<div class="auth-page">
  <div class="auth-container">
    <div class="auth-box">
      <div class="auth-header">
        <h1>Welcome Back</h1>
        <p>Login to ShopEZ</p>
      </div>
      <form [formGroup]="form" (ngSubmit)="submit()" autocomplete="off">
        <div class="form-group">
          <label>Email</label>
          <input formControlName="email" class="form-control" type="email" inputmode="email" autocomplete="off"
            autocapitalize="off" spellcheck="false" [attr.readonly]="emailLocked ? '' : null" (focus)="unlockEmail()">
          @if (form.get('email')?.invalid && form.get('email')?.touched) {
          <div class="error-message">Valid email required</div>
          }
        </div>
        <div class="form-group">
          <label>Password</label>
          <div class="password-field-wrap">
            <input [type]="showPassword ? 'text' : 'password'" formControlName="password" class="form-control"
              autocomplete="off" [attr.readonly]="passwordLocked ? '' : null" (focus)="unlockPassword()">
            <button type="button" class="password-toggle-btn" (click)="showPassword = !showPassword"
              [attr.aria-label]="showPassword ? 'Hide password' : 'Show password'">
              <i class="bi" [class.bi-eye]="!showPassword" [class.bi-eye-slash]="showPassword"></i>
            </button>
          </div>
          @if (form.get('password')?.invalid && form.get('password')?.touched) {
          <div class="error-message">Password required</div>
          }
        </div>
        <button type="submit" class="btn-submit" [disabled]="loading">{{ loading ? 'Logging in...' : 'Login' }}</button>
      </form>
      <div class="auth-footer">
        <p>No account? <a routerLink="/register">Register here</a></p>
        <p class="admin-login-link">Administrator? <a routerLink="/admin-login">Admin login</a></p>
      </div>
    </div>
  </div>
</div>
