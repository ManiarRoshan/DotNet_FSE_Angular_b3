<div class="auth-page">
  <div class="auth-container">
    <div class="auth-box">
      <div class="auth-header">
        <h1>Admin Login</h1>
        <p>Use your ShopEZ API account to browse products and place orders.</p>
      </div>
      <form [formGroup]="form" (ngSubmit)="submit()">
        <div class="form-group">
          <label>Email</label>
          <input formControlName="email" class="form-control" placeholder="admin@shopez.com">
        </div>
        <div class="form-group">
          <label>Password</label>
          <input type="password" formControlName="password" class="form-control" placeholder="admin123">
        </div>
        <button type="submit" class="btn-submit" [disabled]="loading">
          {{loading ? 'Logging...' : 'Login'}}
        </button>
      </form>
      <div class="auth-footer">
        <p><strong>Admin demo</strong> | <a routerLink="/register">Create account</a></p>
      </div>
    </div>
  </div>
</div>
