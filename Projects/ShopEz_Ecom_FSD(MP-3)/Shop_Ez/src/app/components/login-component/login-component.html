<div class="auth-page">
  <div class="auth-container">
    <div class="auth-box">
      <div class="auth-header">
        <h1>Welcome Back</h1>
        <p>Login to ShopEZ</p>
      </div>
      <form [formGroup]="form" (ngSubmit)="submit()">
        <div class="form-group"><label>Email</label><input formControlName="email" class="form-control">
          <div class="error-message" *ngIf="form.get('email')?.invalid && form.get('email')?.touched">Valid email
            required</div>
        </div>
        <div class="form-group"><label>Password</label><input type="password" formControlName="password"
            class="form-control">
          <div class="error-message" *ngIf="form.get('password')?.invalid && form.get('password')?.touched">Password
            required</div>
        </div><button type="submit" class="btn-submit" [disabled]="loading">{{loading?'Logging...':'Login'}}</button>
      </form>
      <div class="auth-footer">
        <p>No account? <a routerLink="/register">Register here</a></p>
      </div>
    </div>
  </div>
</div>
