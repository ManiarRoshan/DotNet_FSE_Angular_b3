<div class="success-page">
      <div class="container">
        <div class="success-card">
          <div class="success-icon">✅</div>
          <h1>Payment Successful!</h1>
          <p>Your transaction was completed securely. Thank you for shopping with us!</p>

          <div class="order-details">
            <div class="detail-row">
              <span>Order ID:</span>
              <strong>#{{ orderData.orderId }}</strong>
            </div>
            <div class="detail-row">
              <span>Amount Paid:</span>
              <strong>₹{{ orderData.totalAmount | number:'1.0-0' }}</strong>
            </div>
            <div class="detail-row">
              <span>Payment Status:</span>
              <strong>Completed</strong>
            </div>
            <div class="detail-row">
              <span>Estimated Delivery:</span>
              <strong>3 – 5 Business Days</strong>
            </div>
          </div>

          <div class="success-buttons">
            <a routerLink="/orders" class="btn-primary">View My Orders</a>
            <a routerLink="/products" class="btn-secondary">Continue Shopping</a>
          </div>
        </div>
      </div>
    </div>
