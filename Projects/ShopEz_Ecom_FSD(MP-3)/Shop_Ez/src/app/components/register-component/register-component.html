<div class="auth-page">
  <div class="auth-container">
    <div class="auth-box">
      <div class="auth-header">
        <h1>Create Account</h1>
        <p>Join ShopEZ today</p>
      </div>
      <form [formGroup]="form" (ngSubmit)="submit()">
        <div class="form-group"><label>Name</label><input formControlName="name" class="form-control">
          <div class="error-message" *ngIf="form.get('name')?.invalid && form.get('name')?.touched">Name required</div>
        </div>
        <div class="form-group"><label>Email</label><input formControlName="email" class="form-control">
          <div class="error-message" *ngIf="form.get('email')?.invalid && form.get('email')?.touched">Valid email
            required</div>
        </div>
        <div class="form-group"><label>Password</label><input type="password" formControlName="password"
            class="form-control">
          <div class="error-message" *ngIf="form.get('password')?.invalid && form.get('password')?.touched">Min 6
            characters</div>
        </div>
        <div class="form-group"><label>Confirm Password</label><input type="password" formControlName="confirm"
            class="form-control">
          <div class="error-message" *ngIf="form.hasError('mismatch') && form.get('confirm')?.touched">Passwords
            mismatch</div>
        </div><button type="submit" class="btn-submit"
          [disabled]="loading">{{loading?'Registering...':'Register'}}</button>
      </form>
      <div class="auth-footer">
        <p>Have an account? <a routerLink="/login">Login here</a></p>
      </div>
    </div>
  </div>
</div>
