<div class="container my-5" *ngIf="product">
  <div class="row g-4">
    <div class="col-md-6">
      <img [src]="getImageUrl()" 
           class="details-img"
           (error)="$event.target.src='assets/images/default-product.svg'">
    </div>
    <div class="col-md-6">
      <div class="details-box">
        <h2>{{product.name}}</h2>
        <div class="details-price">₹{{product.price | number:'1.0-0'}}</div>
        <p class="mt-3">{{product.description}}</p>
        <p><strong>Category:</strong> {{product.category}}</p>
        <p><strong>Stock:</strong> {{product.stock>0 ? product.stock : 'Out of stock'}}</p>
        <div class="quantity-selector mb-3">
          <label>Quantity:</label>
          <input type="number" [(ngModel)]="quantity" min="1" [max]="product.stock" class="form-control w-25 ms-2">
        </div>
        <button class="btn-cart w-auto px-4" (click)="addToCart()" [disabled]="product.stock === 0">
          {{ product.stock === 0 ? 'Out of Stock' : 'Add to Cart' }}
        </button>
        <a routerLink="/products" class="btn-view ms-3">Back</a>
      </div>
    </div>
  </div>
</div>
