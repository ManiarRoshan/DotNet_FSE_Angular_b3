<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>User Info</title>
</head>
<body>
    <h2>User Information</h2>
    <div id="user-display"></div>
    <button id="display-btn">Display Info</button>

    <script >
    let user = {
    name: "Alice Johnson",
    age: 28,
    city: "New York"
};

function displayUserInfo(userObj) {
    const displayArea = document.getElementById("user-display");
    
    // Clear previous content and update DOM using dot notation
    displayArea.innerHTML = `
        <p>Name: ${userObj.name}</p>
        <p>Age: ${userObj.age}</p>
        <p>City: ${userObj.city}</p>
    `;
}

// 3. Set up event listener
document.getElementById("display-btn").addEventListener("click", function() {
    displayUserInfo(user);
});

    </script>
</body>
</html>
