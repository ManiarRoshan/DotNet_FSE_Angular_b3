<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>E-commerce Cart Counter</title>
     <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <style>
        body {
            font-family: sans-serif;
            padding: 20px;
            background-color: #f4f4f9;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #333;
            color: white;
            padding: 10px 20px;
            border-radius: 8px;
        }

        .product-list {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
            margin-top: 20px;
        }

        .product-card {
            background: white;
            padding: 15px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
        }

        .btn-add {
            background-color: #28a745;
            color: white;
            border: none;
            padding: 8px 12px;
            cursor: pointer;
            border-radius: 4px;
        }

        .btn-add:disabled {
            background-color: #ccc;
            cursor: not-allowed;
        }

        .msg {
            margin-left: 10px;
            color: #28a745;
            font-size: 0.9em;
            font-weight: bold;
            display: none;
        }
    </style>
</head>

<body>

    <div class="header">
        <h2>My Store</h2>
        <div>Cart: <span id="cart-count">0</span> items</div>
    </div>

    <div class="product-list" id="product-container">
        <div class="product-card">
            <h3>Wireless Headphones</h3>
            <button class="btn-add" data-id="1">Add to Cart</button>
            <span class="msg">Added!</span>
        </div>
        <div class="product-card">
            <h3>Smart Watch</h3>
            <button class="btn-add" data-id="2">Add to Cart</button>
            <span class="msg">Added!</span>
        </div>
        <div class="product-card">
            <h3>Gaming Mouse</h3>
            <button class="btn-add" data-id="3">Add to Cart</button>
            <span class="msg">Added!</span>
        </div>
        <div class="product-card">
            <h3>Mechanical Keyboard</h3>
            <button class="btn-add" data-id="4">Add to Cart</button>
            <span class="msg">Added!</span>
        </div>
    </div>

    <script>
        $(document).ready(function () {
            let count = 0;
            $('#product-container').on('click','.btn-add',function(){
                const $button = $(this);
                count++;
                $('#cart-count').text(count);
                $button.prop('disabled', true);
                $button.text('In Cart');
                $button.siblings('.msg').fadeIn().delay(1000).fadeOut();
                $button.attr('title','This item is already in your cart');
            });
        });
    </script>
</body>

</html>
