<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Student Feedback Form</title>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <style>
        body {
            font-family: Arial;
            margin: 20px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 5px;
        }

        input,
        select,
        textarea {
            width: 300px;
            padding: 8px;
        }

        .error {
            color: red;
            font-size: 0.9em;
            display: none;
        }

        #successMessage {
            color: green;
            font-weight: bold;
            margin-top: 10px;
            display: none;
        }
    </style>
</head>

<body>

    <h2>Course Feedback Form</h2>
    <form id="feedbackForm">
        <div class="form-group">
            <label>Name:</label>
            <input type="text" id="name" name="name">
            <span class="error" id="nameError">Name is required</span>
        </div>
        <div class="form-group">
            <label>Email:</label>
            <input type="email" id="email" name="email">
            <span class="error" id="emailError">Valid email is required</span>
        </div>
        <div class="form-group">
            <label>Course Rating:</label>
            <select id="rating">
                <option value="">Select Rating</option>
                <option value="excellent">Excellent</option>
                <option value="good">Good</option>
                <option value="fair">Fair</option>
            </select>
        </div>
        <div class="form-group">
            <label>Comments:</label>
            <textarea id="comments"></textarea>
        </div>
        <button type="submit">Submit Feedback</button>
    </form>

    <div id="successMessage">Feedback submitted successfully! Thank you.</div>

    <script>
        $(document).ready(function () {
            $('#feedbackForm').submit(function (event) {
                event.preventDefault();
                var name = $('#name').val();
                var email = $('#email').val();
                var isValid = true;
                if(name.trim() === "") {
                    $('#nameError').show();
                    isValid = false;
                }else{
                    $('#nameError').hide();
                }
                if (email.trim() === "") {
                    $('#emailError').show();
                    isValid = false;
                } else {
                    $('#emailError').hide();
                }
                if (isValid) {
                    $('#successMessage').fadeIn().delay(3000).fadeOut();
                    $('#feedbackForm')[0].reset(); 
                }
            });
        });
    </script>

</body>

</html>
